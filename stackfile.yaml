name: manifest

resources:
  manifest:
    build:
      repo: https://github.com/dariusta/manifest.git
      branch: main
      dockerfile: docker/Dockerfile
      context: .
    ports:
      - name: http
        port: 2099
        protocol: HTTP
        public: true
        subdomain: manifest
        tls: true
    env:
      PORT: '2099'
      BIND_ADDRESS: 0.0.0.0
      BETTER_AUTH_URL: '{{ self.public_url }}'
      MANIFEST_MODE: selfhosted
      NODE_ENV: production
      RUN_MIGRATIONS_ON_BOOT: 'true'
      REQUEST_RECORDING_STORAGE: filesystem
      REQUEST_RECORDING_FILESYSTEM_PATH: /data/request-recordings
      SHUTDOWN_DRAIN_MS: '10000'
    secrets:
      manifest-runtime:
        BETTER_AUTH_SECRET: better_auth_secret
        MANIFEST_ENCRYPTION_KEY: encryption_key
    addons:
      manifest-db:
        type: postgres
        database: manifest
        env:
          DATABASE_URL: '{{ url }}'
          DATABASE_CA_CERT: '{{ ca_certificate }}'
    volumes:
      - name: recordings
        path: /data/request-recordings
    replicas: 1

volumes:
  recordings:
    size: 10Gi
    access_mode: ReadWriteOnce
