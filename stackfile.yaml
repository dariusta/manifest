name: manifest

resources:
  manifest:
    build:
      repo: https://github.com/dariusta/manifest.git
      branch: main
      dockerfile: docker/Dockerfile
      context: .
    ports:
      - name: http
        port: 2099
        protocol: HTTP
        public: true
        subdomain: manifest
        domain: stackdome.62.146.175.26.nip.io
        tls: true
    env:
      PORT: '2099'
      BIND_ADDRESS: 0.0.0.0
      BETTER_AUTH_URL: '{{ self.public_url }}'
      MANIFEST_MODE: selfhosted
      NODE_ENV: production
      RUN_MIGRATIONS_ON_BOOT: 'true'
      REQUEST_RECORDING_STORAGE: filesystem
      REQUEST_RECORDING_FILESYSTEM_PATH: /data/request-recordings
      # Optional S3/R2 cutover. Leave the recordings volume mounted while
      # dual-reading. Access keys belong in secrets, not this file.
      # 0, none, or forever disables retention deletes.
      # REQUEST_RECORDING_STORAGE: s3
      # REQUEST_RECORDING_S3_BUCKET:
      # REQUEST_RECORDING_S3_ENDPOINT:
      # REQUEST_RECORDING_S3_REGION: auto
      # REQUEST_RECORDING_S3_PREFIX: manifest/recordings/
      # REQUEST_RECORDING_FALLBACK_FILESYSTEM_PATH: /data/request-recordings
      # REQUEST_RECORDING_RETENTION_DAYS: "0"
      SHUTDOWN_DRAIN_MS: '10000'
    secrets:
      manifest-runtime:
        BETTER_AUTH_SECRET: better_auth_secret
        MANIFEST_ENCRYPTION_KEY: encryption_key
    addons:
      manifest-db:
        type: postgres
        database: manifest
        env:
          DATABASE_URL: '{{ url }}'
          DATABASE_CA_CERT: '{{ ca_certificate }}'
    volumes:
      - name: recordings
        path: /data/request-recordings
    replicas: 1

volumes:
  recordings:
    size: 10Gi
    access_mode: ReadWriteOnce
